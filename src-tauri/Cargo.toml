[package]
name = "acgn-hub"
version = "0.5.2"
description = "ACGN 作品发现、下载与离线阅读桌面应用"
authors = ["ACGN Hub"]
edition = "2021"

[lib]
name = "acgn_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
dunce = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "system-proxy", "gzip", "brotli"] }
base64 = "0.22"
tokio = { version = "1", features = ["time", "sync", "macros", "net"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
zip = "2"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
# CBZ pages use stored/deflate ZIP entries. Avoid bundling desktop C compression
# libraries (xz/zstd/bzip2) that are unused by our native Android downloads.
zip = { version = "2", default-features = false, features = ["deflate"] }
